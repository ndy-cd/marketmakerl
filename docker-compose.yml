services:
  agents:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketmakerl-agents:latest
    working_dir: /app
    environment:
      PYTHONPATH: /app
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      # Mount full repo so Docker runs always execute latest local code
      # (scripts/src/tests/docs), while dependencies stay image-managed.
      - ./:/app
    command: ["python3", "scripts/run_agents.py", "--config", "config/config.yaml", "--mode", "backtest", "--max-workers", "4"]
